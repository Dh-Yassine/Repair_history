[build]
  command = "npm install && npm install --prefix backend && npm install --prefix frontend && npm run db:generate --prefix backend && npm run build --prefix frontend"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NETLIFY = "true"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = [
    "@prisma/client",
    ".prisma",
    "express",
    "cors",
    "dotenv",
    "multer",
    "bcryptjs",
    "jsonwebtoken",
    "@supabase/supabase-js",
    "nodemailer",
    "serverless-http",
    "pdf-parse",
    "tesseract.js"
  ]
  included_files = [
    "backend/node_modules/.prisma/**",
    "backend/node_modules/@prisma/client/**",
    "backend/prisma/schema.prisma",
    "backend/src/**"
  ]

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/badge/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
