[build]
  command = "npm install && npm install --prefix frontend && npx prisma generate --schema=backend/prisma/schema.prisma && npm run build:web"
  publish = "frontend/dist"
  functions = "netlify/functions"

[build.environment]
  NETLIFY = "true"
  NODE_VERSION = "20"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@prisma/client", ".prisma", "express", "cors", "bcryptjs", "jsonwebtoken", "multer", "nodemailer", "@supabase/supabase-js", "serverless-http"]
  included_files = [
    "node_modules/.prisma/**",
    "node_modules/@prisma/client/**",
    "backend/prisma/schema.prisma",
    "backend/src/**",
    "backend/node_modules/.prisma/**",
    "backend/node_modules/@prisma/client/**"
  ]

[functions.api]
  timeout = 26

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/uploads/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/badge/*"
  to = "/.netlify/functions/api"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
